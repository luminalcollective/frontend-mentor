
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta
      name="description"
      content="A responsive and accessible QR code component built for the Frontend Mentor challenge using semantic HTML and modern CSS."
    >

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon/LC_Favicon_16.png"
    >

    <link rel="icon" type="image/svg+xml" href="./images/favicon/LC_Favicon.svg">
    <link rel="icon" type="image/x-icon" href="./images/favicon/LC_Favicon.ico" sizes="any">

    <link rel="stylesheet" href="./css/style.css">

    <title>Frontend Mentor | QR Code Component</title>
  </head>

  <body>
    <!-- Main content -->
    <main class="page-layout">
      <div class="container">
        <article class="card">
          <img
            src="./images/image-qr-code.png"
            alt="QR code to visit Frontend Mentor"
            class="qr-code"
            width="288"
            height="288"
          >

          <h1 class="title">
            Improve your front-end skills by building projects
          </h1>

          <p class="description">
            Scan the QR code to visit Frontend Mentor
            and take your coding skills to the next level.
          </p>
        </article>
      </div>
    </main>

    <!-- Attribution -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">
        Frontend Mentor
      </a>.

      Coded by
      <a href="https://github.com/luminalcollective">
        Luminal Collective
      </a>.
    </footer>
  </body>
</html>
